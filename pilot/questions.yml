# Pilot only, step 6 of the build plan. NOT the frozen question set.
# The frozen set is questions.yml at the repo root, written by the user in step 7.
# v2, October 15: v1 (81224e1) scored 5 of 5 on names only, because the
# model knew jaffle_shop's status values. v2 asks about seeded status codes
# and company definitions a model cannot know.
# context: the answer depends on a fact names alone do not give.
# control: the column names alone should be enough.
questions:
  - id: p1
    group: context
    question: How many orders are currently in transit to the customer?
    hidden_fact: "In transit is status code '20' (orders_status doc, seeded)."
    golden_sql: select count(*) from orders where status = '20'

  - id: p2
    group: context
    question: What is our net revenue?
    hidden_fact: "Company definition: net revenue is order amount excluding orders with a return pending ('40') or returned ('50')."
    golden_sql: select sum(amount) from orders where status not in ('40', '50')

  - id: p3
    group: context
    question: How many active customers do we have?
    hidden_fact: "Company definition: a customer is active when their most recent order falls within 30 days of the latest order date in the data."
    golden_sql: >-
      select count(*) from customers
      where most_recent_order >= (select max(order_date) from orders) - interval 30 day

  - id: c1
    group: control
    question: How many customers have placed more than 3 orders?
    golden_sql: select count(*) from customers where number_of_orders > 3

  - id: c2
    group: control
    question: What is the total amount paid by gift card across all orders?
    golden_sql: select sum(gift_card_amount) from orders
