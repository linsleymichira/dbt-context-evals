version: 2

models:
  - name: customers

    columns:
      - name: customer_id
        tests:
          - unique
          - not_null

      - name: first_name

      - name: last_name

      - name: first_order

      - name: most_recent_order

      - name: number_of_orders

      - name: total_order_amount

  - name: orders

    columns:
      - name: order_id
        tests:
          - unique
          - not_null

      - name: customer_id
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('customers')
                field: customer_id

      - name: order_date

      - name: status
        tests:
          - accepted_values:
              arguments:
                values: ['placed', 'shipped', 'completed', 'return_pending', 'returned']

      - name: amount
        tests:
          - not_null

      - name: credit_card_amount
        tests:
          - not_null

      - name: coupon_amount
        tests:
          - not_null

      - name: bank_transfer_amount
        tests:
          - not_null

      - name: gift_card_amount
        tests:
          - not_null
